<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KindleFy</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

<header>

    <div id="status-bar">
        <span id="time">00:00</span>

        <div class="status-right">
            <span id="network">Online</span>
            <span id="battery">--%</span>
        </div>
    </div>

    <h1>KindleFy</h1>
    <p>Your Kindle Companion</p>

</header>

<main class="apps">

    <a class="app" href="apps/calculator/index.html">
        <img src="assets/icons/calculator.svg">
        <span>Calculator</span>
    </a>

    <a class="app" href="apps/notes/index.html">
        <img src="assets/icons/notes.svg">
        <span>Notes</span>
    </a>

    <a class="app" href="apps/snake/index.html">
        <img src="assets/icons/snake.svg">
        <span>Snake</span>
    </a>

    <a class="app" href="apps/chess/index.html">
        <img src="assets/icons/chess.svg">
        <span>Chess</span>
    </a>

    <a class="app" href="apps/sudoku/index.html">
        <img src="assets/icons/sudoku.svg">
        <span>Sudoku</span>
    </a>

    <a class="app" href="apps/settings/index.html">
        <img src="assets/icons/settings.svg">
        <span>Settings</span>
    </a>

</main>

<footer>
    KindleFy v1.0
</footer>

<script src="scripts/app.js"></script>
<script src="scripts/games.js"></script>
<script src="scripts/offline.js"></script>

</body>
</html>
