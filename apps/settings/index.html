<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KindleFy Settings</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:25px;
}

h1{
    text-align:center;
}

.card{
    background:white;
    border:2px solid black;
    border-radius:12px;
    padding:20px;
    margin:20px 0;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    font-size:18px;
    border:2px solid black;
    background:white;
    cursor:pointer;
}

button:hover{
    background:#ddd;
}

select{
    width:100%;
    padding:12px;
    font-size:18px;
}

a{
    display:block;
    margin-top:25px;
    text-align:center;
    text-decoration:none;
    color:black;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>⚙️ Settings</h1>

<div class="card">

<h2>Language</h2>

<select id="language">

<option value="en">English</option>
<option value="bg">Български</option>

</select>

</div>

<div class="card">

<h2>Wallpaper</h2>

<button onclick="changeWallpaper()">

Change Wallpaper

</button>

</div>

<div class="card">

<h2>Storage</h2>

<button onclick="clearData()">

Clear KindleFy Data

</button>

</div>

<a href="../../index.html">

⬅ Back

</a>

<script>

const language=document.getElementById("language");

language.value=localStorage.getItem("language")||"en";

language.onchange=()=>{

localStorage.setItem("language",language.value);

alert("Language saved!");

}

function changeWallpaper(){

alert("Wallpaper manager is coming in Version 1.1");

}

function clearData(){

if(confirm("Delete all KindleFy data?")){

localStorage.clear();

alert("Done!");

}

}

</script>

</body>
</html>
