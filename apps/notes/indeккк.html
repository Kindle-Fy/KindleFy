<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KindleFy Notes</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:20px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:350px;
    font-size:18px;
    padding:15px;
    border:2px solid black;
    border-radius:10px;
    resize:none;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    font-size:18px;
    border:2px solid black;
    background:white;
    cursor:pointer;
}

button:hover{
    background:#ddd;
}

a{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    font-weight:bold;
    color:black;
}

</style>

</head>

<body>

<h1>📝 Notes</h1>

<textarea id="notes" placeholder="Write something..."></textarea>

<button onclick="saveNotes()">💾 Save</button>

<button onclick="clearNotes()">🗑 Clear</button>

<a href="../../index.html">⬅ Back</a>

<script>

const notes=document.getElementById("notes");

notes.value=localStorage.getItem("kindlefy-notes")||"";

function saveNotes(){

localStorage.setItem("kindlefy-notes",notes.value);

alert("Notes saved!");

}

function clearNotes(){

if(confirm("Delete all notes?")){

notes.value="";

localStorage.removeItem("kindlefy-notes");

}

}

</script>

</body>
</html>
